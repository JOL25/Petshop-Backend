spring.application.name=petshop-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.payment.currency=${PAYMENT_CURRENCY:PEN}
app.payment.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.payment.webhook-url=${PAYMENT_WEBHOOK_URL:}
app.mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
