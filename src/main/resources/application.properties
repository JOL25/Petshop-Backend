spring.application.name=petshop-backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.payment.currency=${PAYMENT_CURRENCY:PEN}
app.payment.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.payment.webhook-url=${PAYMENT_WEBHOOK_URL:}
app.mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}

springdoc.swagger-ui.path=/swagger-ui.html

app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-name=${SEED_ADMIN_NAME:Administrador Petshop}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@petshop.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
